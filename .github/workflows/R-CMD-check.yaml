# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R_PKGTYPE: source
      PKGCACHE_HTTP_VERSION: "2"
      NOT_CRAN: false

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      # R CMD check runs no tests here (NOT_CRAN is false), and this is the only
      # clang build. The 2D padding test needs clang: gcc zeroes struct padding
      # even where C++ does not require it. Uses the build R CMD check installed.
      - name: 2D track padding test (clang)
        if: runner.os == 'macOS'
        env:
          NOT_CRAN: true
        run: |
          Rscript -e '.libPaths(c("check/misha.Rcheck", .libPaths())); cat("misha from", system.file(package = "misha"), "\n"); testthat::test_file("tests/testthat/test-2d-track-padding.R", package = "misha", load_package = "installed", stop_on_failure = TRUE)'
